name: Build Madeira iPhone 13 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version

          echo "=== FEX ==="
          git -C FEX rev-parse --short HEAD || true

          echo "=== Wine ==="
          git -C wine rev-parse --short HEAD || true

          echo "=== DXMT ==="
          git -C research/dxmt rev-parse --short HEAD || true

      - name: Check required libraries
        run: |
          echo "=== Required libraries ==="

          for f in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libwin32u_unix.a
          do
            if [ -f "$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
            fi
          done

      - name: Fetch Microsoft VC Runtime
        run: |
          brew install sevenzip

          curl -L \
            https://aka.ms/vc14/vc_redist.x64.exe \
            -o /tmp/VC_redist.x64.exe

          rm -rf /tmp/vcredist
          rm -rf /tmp/vcruntime-dlls

          mkdir -p /tmp/vcredist
          mkdir -p /tmp/vcruntime-dlls
          mkdir -p app/Madeira/x86_64-vcruntime

          7zz x /tmp/VC_redist.x64.exe \
            -o/tmp/vcredist \
            -y

          echo "=== Extracting CAB files ==="

          find /tmp/vcredist -type f -iname "*.cab" | while read cab
          do
            echo "Extracting: $cab"
            7zz x "$cab" \
              -o/tmp/vcruntime-dlls \
              -y || true
          done

          echo "=== Searching runtime DLLs ==="

          for dll in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            found="$(find /tmp/vcruntime-dlls -type f -iname "$dll" | head -1)"

            if [ -z "$found" ]; then
              echo "MISSING: $dll"
              exit 1
            fi

            echo "FOUND: $dll"
            cp "$found" "app/Madeira/x86_64-vcruntime/$dll"
          done

          echo "=== VC Runtime ready ==="
          ls -lh app/Madeira/x86_64-vcruntime

      - name: Build unsigned Madeira
        run: |
          set -o pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package unsigned IPA
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ ! -d "build/Release-iphoneos/Madeira.app" ]; then
            echo "Madeira.app was not found"
            find build -maxdepth 4 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/Release-iphoneos/Madeira.app \
            Payload/

          zip -qry \
            Madeira-iPhone13-unsigned.ipa \
            Payload

          echo "=== IPA ==="
          ls -lh Madeira-iPhone13-unsigned.ipa

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone13-build
          path: |
            Madeira-iPhone13-unsigned.ipa
            build.log
          if-no-files-found: warn
