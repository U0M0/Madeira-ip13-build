name: Build Madeira iPhone 13 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version

          echo "=== FEX ==="
          git -C FEX rev-parse --short HEAD || true

          echo "=== Wine ==="
          git -C wine rev-parse --short HEAD || true

          echo "=== DXMT ==="
          git -C research/dxmt rev-parse --short HEAD || true

      - name: Check required libraries
        run: |
          echo "=== Required libraries ==="

          for f in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libwin32u_unix.a
          do
            if [ -f "$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
            fi
          done

      - name: Fetch Microsoft VC Runtime
        run: |
          set -e

          brew install cabextract

          rm -rf /tmp/vcredist
          rm -rf app/Madeira/x86_64-vcruntime

          mkdir -p /tmp/vcredist/outer
          mkdir -p /tmp/vcredist/dlls
          mkdir -p app/Madeira/x86_64-vcruntime

          echo "=== Download VC++ 14.44.35211 x64 ==="

          curl --fail --location \
            "https://download.visualstudio.microsoft.com/download/pr/73aabf2e-9532-4f68-99f7-3247081a619c/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe" \
            -o /tmp/VC_redist.x64.exe

          echo "=== Extract outer installer ==="

          cabextract \
            -d /tmp/vcredist/outer \
            /tmp/VC_redist.x64.exe

          echo "=== Outer payloads ==="

          ls -lah /tmp/vcredist/outer

          echo "=== Find x64 runtime CAB ==="

          runtime_cab=""

          for payload in /tmp/vcredist/outer/*
          do
            [ -f "$payload" ] || continue

            echo "Checking: $payload"

            if cabextract -l "$payload" 2>/dev/null \
              | grep -qi "vcruntime140.dll_amd64"
            then
              runtime_cab="$payload"
              echo "FOUND runtime CAB: $runtime_cab"
              break
            fi
          done

          if [ -z "$runtime_cab" ]; then
            echo "ERROR: Could not find x64 VC runtime CAB"
            echo
            echo "=== Diagnostic payload listing ==="

            for payload in /tmp/vcredist/outer/*
            do
              [ -f "$payload" ] || continue
              echo
              echo "----- $payload -----"
              file "$payload" || true
              cabextract -l "$payload" 2>&1 || true
            done

            exit 1
          fi

          echo "=== Extract runtime CAB ==="

          cabextract \
            -d /tmp/vcredist/dlls \
            "$runtime_cab"

          echo "=== Extracted runtime files ==="

          find /tmp/vcredist/dlls \
            -maxdepth 1 \
            -type f \
            -print

          echo "=== Copy required DLLs ==="

          for dll in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            src="/tmp/vcredist/dlls/${dll}_amd64"

            if [ ! -f "$src" ]; then
              echo "ERROR: Missing $src"
              exit 1
            fi

            cp "$src" \
              "app/Madeira/x86_64-vcruntime/$dll"

            echo "OK: $dll"
          done

          echo "=== VC Runtime ready ==="

          ls -lh app/Madeira/x86_64-vcruntime
          
      - name: Build unsigned Madeira
        run: |
          set -o pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package unsigned IPA
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ ! -d "build/Release-iphoneos/Madeira.app" ]; then
            echo "Madeira.app was not found"
            find build -maxdepth 4 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/Release-iphoneos/Madeira.app \
            Payload/

          zip -qry \
            Madeira-iPhone13-unsigned.ipa \
            Payload

          echo "=== IPA ==="
          ls -lh Madeira-iPhone13-unsigned.ipa

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone13-build
          path: |
            Madeira-iPhone13-unsigned.ipa
            build.log
          if-no-files-found: warn
