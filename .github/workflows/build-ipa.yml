name: Build Madeira iPhone 13 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version

          echo "=== FEX ==="
          git -C FEX rev-parse --short HEAD || true

          echo "=== Wine ==="
          git -C wine rev-parse --short HEAD || true

          echo "=== DXMT ==="
          git -C research/dxmt rev-parse --short HEAD || true

      - name: Check required libraries
        run: |
          echo "=== Required libraries ==="

          for f in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libwin32u_unix.a
          do
            if [ -f "$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
            fi
          done

      - name: Fetch Microsoft VC Runtime
        run: |
          set -e

          brew install cabextract

          rm -rf /tmp/vcredist
          rm -rf app/Madeira/x86_64-vcruntime

          mkdir -p /tmp/vcredist/outer
          mkdir -p /tmp/vcredist/dlls
          mkdir -p app/Madeira/x86_64-vcruntime

          echo "=== Download VC++ 14.44.35211 x64 ==="

          curl --fail --location \
            "https://download.visualstudio.microsoft.com/download/pr/73aabf2e-9532-4f68-99f7-3247081a619c/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe" \
            -o /tmp/VC_redist.x64.exe

          echo "=== Extract outer installer ==="

          cabextract \
            -d /tmp/vcredist/outer \
            /tmp/VC_redist.x64.exe

          echo "=== Outer payloads ==="

          ls -lah /tmp/vcredist/outer

          echo "=== Find x64 runtime CAB ==="

          runtime_cab=""

          for payload in /tmp/vcredist/outer/*
          do
            [ -f "$payload" ] || continue

            echo "Checking: $payload"

            if cabextract -l "$payload" 2>/dev/null \
              | grep -qi "vcruntime140.dll_amd64"
            then
              runtime_cab="$payload"
              echo "FOUND runtime CAB: $runtime_cab"
              break
            fi
          done

          if [ -z "$runtime_cab" ]; then
            echo "ERROR: Could not find x64 VC runtime CAB"
            echo
            echo "=== Diagnostic payload listing ==="

            for payload in /tmp/vcredist/outer/*
            do
              [ -f "$payload" ] || continue
              echo
              echo "----- $payload -----"
              file "$payload" || true
              cabextract -l "$payload" 2>&1 || true
            done

            exit 1
          fi

          echo "=== Extract runtime CAB ==="

          cabextract \
            -d /tmp/vcredist/dlls \
            "$runtime_cab"

          echo "=== Extracted runtime files ==="

          find /tmp/vcredist/dlls \
            -maxdepth 1 \
            -type f \
            -print

          echo "=== Copy required DLLs ==="

          for dll in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            src="/tmp/vcredist/dlls/${dll}_amd64"

            if [ ! -f "$src" ]; then
              echo "ERROR: Missing $src"
              exit 1
            fi

            cp "$src" \
              "app/Madeira/x86_64-vcruntime/$dll"

            echo "OK: $dll"
          done

          echo "=== VC Runtime ready ==="

          ls -lh app/Madeira/x86_64-vcruntime
          
      - name: Patch FEX iOS diagnostics
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp")
          text = path.read_text()

          old = '''  MEMORY_BASIC_INFORMATION mbi {};
            const char* type = "?";
            if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {
              type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";
            }
            LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "
                              "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,
                              mbi.Protect, type, mbi.State);
          '''

          new = '''  LogMan::Msg::EFmt(
              "[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} crosses16B={}",
              Size,
              AddressReg,
              GPRs[AddressReg],
              GPRs[AddressReg] & 15,
              (GPRs[AddressReg] & 15) ? "yes" : "no");
          '''

          if old not in text:
              raise SystemExit("ERROR: Expected Arm64.cpp diagnostic block was not found")

          path.write_text(text.replace(old, new, 1))
          print("Patched Arm64.cpp successfully")
          PY
          
      - name: Build FEX for iOS
        run: |
          set -euxo pipefail

          brew install ninja cmake

          rm -rf FEX/build-ios

          echo "=== Configure FEX for iOS ==="

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_ASM_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DTUNE_CPU=none

          echo "=== Build FEX ==="

          cmake --build FEX/build-ios \
            --target \
              FEXCore \
              FEXCore_Base \
              JemallocLibs \
            -j 3

          echo "=== Verify generated FEX files ==="

          required_files=(
            "FEX/build-ios/include/FEXCore/Config/ConfigValues.inl"
            "FEX/build-ios/include/FEXCore/Config/ConfigOptions.inl"
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
          )

          for f in "${required_files[@]}"
          do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi

            echo "OK: $f"
          done

          echo "=== FEX iOS build complete ==="
          
      - name: Inspect Wine build scripts
        run: |
          set -euxo pipefail

          echo "=== All build scripts ==="
          find build -maxdepth 2 -name build.sh -print

          echo "=== Search for libwineserver.a creators ==="
          grep -RIn \
            "libwineserver.a" \
            build \
            scripts \
            tools \
            . \
            --exclude-dir=.git \
            --exclude-dir=FEX \
            --exclude-dir=research \
            | head -100
            
      - name: Build base wineserver archive
        run: |
          set -euxo pipefail

          brew install bison flex llvm lld

          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

          echo "=== Toolchain ==="
          which clang
          clang --version

          which llvm-dlltool

          which lld || true
          which ld.lld || true

          bison --version
          flex --version

          echo "=== Test Windows ARM64 PE compiler ==="

          cat >/tmp/test.c <<'EOF'
          int main(void) { return 0; }
          EOF

          clang \
            -target aarch64-windows \
            -fuse-ld=lld \
            -nostdlib \
            -Wl,-entry:main \
            -Wl,-subsystem:console \
            /tmp/test.c \
            -o /tmp/test.exe

          file /tmp/test.exe

          mkdir -p wine/build-macos
          cd wine/build-macos

          ../configure \
            --enable-win64 \
            --without-x \
            --without-wayland \
            --without-opengl \
            --without-vulkan \
            --without-pulse \
            --without-alsa \
            --without-cups \
            --without-dbus \
            --without-fontconfig \
            --without-freetype \
            --without-gnutls \
            --without-gstreamer \
            --without-pcap \
            --without-sane \
            --without-oss \
            --without-opencl \
            --without-unwind

          make -j3 server/wineserver

                    echo "=== Build wineserver objects ==="
          make -j3 server/wineserver

          echo "=== Find wineserver objects ==="
          find server -maxdepth 1 -type f -name "*.o" -print

          mkdir -p "$GITHUB_WORKSPACE/build/wineserver/obj"

          mapfile -t objects < <(
            find server -maxdepth 1 -type f -name "*.o" -print
          )

          if [ "${#objects[@]}" -eq 0 ]; then
            echo "ERROR: No wineserver object files were built"
            exit 1
          fi

          echo "Found ${#objects[@]} wineserver objects"

          ar rcs \
            "$GITHUB_WORKSPACE/build/wineserver/obj/libwineserver.a" \
            "${objects[@]}"

          echo "=== Base libwineserver.a ==="
          ls -lh "$GITHUB_WORKSPACE/build/wineserver/obj/libwineserver.a"

          echo "=== Archive contents ==="
          ar t "$GITHUB_WORKSPACE/build/wineserver/obj/libwineserver.a" | head -100
            
      - name: Build Wine native libraries
        run: |
          set -euxo pipefail

          echo "=== Available Wine build scripts ==="
          find build -maxdepth 2 -name build.sh -print

          echo "=== Build wineserver ==="
          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

          echo "=== Build ntdll unix ==="
          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

          echo "=== Build win32u unix ==="
          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

          echo "=== Verify Wine libs ==="

          for f in \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a
          do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi

            echo "OK: $f"
            ls -lh "$f"
          done
          
     
      - name: Build unsigned Madeira
        run: |
          set -o pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package unsigned IPA
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ ! -d "build/Release-iphoneos/Madeira.app" ]; then
            echo "Madeira.app was not found"
            find build -maxdepth 4 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/Release-iphoneos/Madeira.app \
            Payload/

          zip -qry \
            Madeira-iPhone13-unsigned.ipa \
            Payload

          echo "=== IPA ==="
          ls -lh Madeira-iPhone13-unsigned.ipa

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone13-build
          path: |
            Madeira-iPhone13-unsigned.ipa
            build.log
          if-no-files-found: warn
